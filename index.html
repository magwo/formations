<!DOCTYPE html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="formations.js"></script>
    <script src="main.js"></script>
    <style>
        html {
            margin: 0;
            overflow: hidden;
        }

        body {
            display: block;
            position: relative;
            overflow: hidden;
            padding-top: 12px;
            margin: 0;
            font-family: sans-serif;
            font-size: 18px;
            line-height: 1.1;
            text-transform: capitalize;
            justify-content: center;
            color: #666;
        }

        body #viewport {
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            width: 560px;
            height: 900px;
            overflow: hidden;
        }

        .aircraft-selection-list {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }
        .aircraft-selector {
            width: 32px;
            height: 32px;
            background-size: cover;
            opacity: 0.5;
            transition: opacity 400ms ease-in-out;
        }
        .aircraft-selector:hover, .aircraft-selector:active, .aircraft-selector[toggled] {
            opacity: 1.0;
        }

        .formation-selection-list {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
        }
        .formation-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 8px;
            margin-right: 8px;
            padding: 4px;
            width: 64px;
            height: 64px;
            background-color: #dfdfdf;
            font-size: 12px;
            box-sizing: border-box;
            cursor: pointer;
        }
        .formation-selector[toggled] {
            background-color: #efefef;
            color: #222;
        }

        /* Transition duration must match TRANSITION_DURATION_MS in main.js. */
        .aircraft {
            position: absolute;
            z-index: 1;
            width: 64px;
            height: 64px;
            background-size: cover;
            transition: all 2000ms cubic-bezier(0.45, 0, 0.55, 1), background-image 400ms;
            transform: translateZ(0);
            background-image: url('images/viper@2x.png');
            transform-origin: 50% 50%;
        }
        /* Duration and easing must match the .aircraft position transition. */
        .aircraft.in-transit {
            animation: aircraft-in-transit 2000ms cubic-bezier(0.45, 0, 0.55, 1);
        }
        @keyframes aircraft-in-transit {
            0%   { scale: 1; }
            30%  { scale: 0.8; }
            70%  { scale: 0.8; }
            100% { scale: 1; }
        }
        .aircraft .number {
            position: absolute;
            bottom: 26px;
            right: -10px;
            font-size: 15px;
            transform: rotate(-45deg);
            transition: opacity 200ms;
            opacity: 0.3;
        }
        .aircraft:hover .number, .aircraft:hover .number {
            opacity: 1;
        }

        .faded {
            opacity: 0;
            z-index: 0;
        }

        [hidden] {
            display: none;
        }
    </style>
</head>

<body>

    <div class="aircraft-selection-list">
        <div class="aircraft-selector" data-aircraft="VIPER" style="background-image: url(images/viper@2x.png)" onclick="toggleAndSetAircraft(this, this.style['background-image'])"></div>
        <div class="aircraft-selector" data-aircraft="FLANKER" style="background-image: url(images/flanker@2x.png)" onclick="toggleAndSetAircraft(this, this.style['background-image'])"></div>
        <div class="aircraft-selector" data-aircraft="TOMCAT" style="background-image: url(images/tomcat@2x.png)" onclick="toggleAndSetAircraft(this, this.style['background-image'])"></div>
        <div class="aircraft-selector" data-aircraft="HORNET" style="background-image: url(images/hornet@2x.png)" onclick="toggleAndSetAircraft(this, this.style['background-image'])"></div>
        <div class="aircraft-selector" data-aircraft="VIGGEN" style="background-image: url(images/viggen@2x.png)" onclick="toggleAndSetAircraft(this, this.style['background-image'])"></div>
        <div class="aircraft-selector" data-aircraft="GRIPEN" style="background-image: url(images/gripen@2x.png)" onclick="toggleAndSetAircraft(this, this.style['background-image'])"></div>
        <div class="aircraft-selector" data-aircraft="FISHBED" style="background-image: url(images/fishbed@2x.png)" onclick="toggleAndSetAircraft(this, this.style['background-image'])"></div>
        <div class="aircraft-selector" data-aircraft="HARRIER" style="background-image: url(images/harrier@2x.png)" onclick="toggleAndSetAircraft(this, this.style['background-image'])"></div>
        <div class="aircraft-selector" data-aircraft="WARTHOG" style="background-image: url(images/warthog@2x.png)" onclick="toggleAndSetAircraft(this, this.style['background-image'])"></div>
        <div class="aircraft-selector" data-aircraft="APACHE" style="background-image: url(images/apache@2x.png)" onclick="toggleAndSetAircraft(this, this.style['background-image'])"></div>
    </div>
    <div class="formation-selection-list">
        <div class="formation-selector" data-formation="TWO_SHIP_ECHELON_LEFT" onclick="toggleAndSetFormation(this, TWO_SHIP_ECHELON_LEFT)">
            Two-ship echelon left
        </div>
        <div class="formation-selector" data-formation="FOUR_SHIP_ECHELON_LEFT" onclick="toggleAndSetFormation(this, FOUR_SHIP_ECHELON_LEFT)">
            Four-ship echelon left
        </div>
        <div class="formation-selector" data-formation="FINGER_FOUR_LEFT" onclick="toggleAndSetFormation(this, FINGER_FOUR_LEFT)">
            Finger four left
        </div>
        <div class="formation-selector" data-formation="TRAIL" onclick="toggleAndSetFormation(this, TRAIL)">
            Trail
        </div>
        <div class="formation-selector" data-formation="COMBAT_SPREAD" onclick="toggleAndSetFormation(this, COMBAT_SPREAD)">
            Combat spread
        </div>
    </div>
    <div class="formation-selection-list">
        <div class="formation-selector" data-formation="TWO_SHIP_ECHELON_RIGHT" onclick="toggleAndSetFormation(this, TWO_SHIP_ECHELON_RIGHT)">
            Two-ship echelon right
        </div>
        <div class="formation-selector" data-formation="FOUR_SHIP_ECHELON_RIGHT" onclick="toggleAndSetFormation(this, FOUR_SHIP_ECHELON_RIGHT)">
            Four-ship echelon right
        </div>
        <div class="formation-selector" data-formation="FINGER_FOUR_RIGHT" onclick="toggleAndSetFormation(this, FINGER_FOUR_RIGHT)">
            Finger four right
        </div>
        
        <div class="formation-selector" data-formation="FIGHTING_WING" onclick="toggleAndSetFormation(this, FIGHTING_WING)">
            Fighting wing
        </div>
        <div class="formation-selector" data-formation="TRAILING_FIGHTING_WINGS" onclick="toggleAndSetFormation(this, TRAILING_FIGHTING_WINGS)">
            Trailing fighting wings
        </div>

    </div>

    <div id="viewport">
    </div>

    <template id="aircraft-template">
        <div class="aircraft">
            <div class="number"></div>
        </div>
    </template>

    <script>
        let init = () => {
            const viewport = document.getElementById("viewport")
            const aircraftTemplate = document.getElementById("aircraft-template");
            initFormations(viewport, aircraftTemplate);
            selectAircraftFromQuery();
            selectFormationFromQuery();
        }
        init();

        function selectAircraftFromQuery() {
            const aircraftId = new URLSearchParams(window.location.search).get("a");
            const matchingSelector = aircraftId
                && document.querySelector(`.aircraft-selector[data-aircraft="${CSS.escape(aircraftId)}"]`);
            (matchingSelector || document.querySelector(".aircraft-selector")).click();
        }

        function selectFormationFromQuery() {
            const formationId = new URLSearchParams(window.location.search).get("f");
            const matchingSelector = FORMATIONS_BY_ID[formationId]
                && document.querySelector(`.formation-selector[data-formation="${formationId}"]`);
            (matchingSelector || document.querySelector(".formation-selector")).click();
        }

        function setQueryParam(key, value) {
            const url = new URL(window.location.href);
            url.searchParams.set(key, value);
            history.replaceState(null, "", url);
        }

        function toggleAndSetAircraft(element, aircraftUrl) {
            setToggled(element, ".aircraft-selector");
            setAllAircraftImage(aircraftUrl);
            setQueryParam("a", element.dataset.aircraft);
        }

        function toggleAndSetFormation(element, formation) {
            setToggled(element, ".formation-selector");
            setFormation(formation);
            setQueryParam("f", formation.id);
        }

        function setToggled(element, selector) {
            const all = document.querySelectorAll(selector)
            Array.from(all).forEach((other) => {
                other.removeAttribute("toggled");
            });
            element.setAttribute("toggled", true);
        }
    </script>
</body>
